{% extends 'base.html' %}
{% block title %}Conversation{% endblock %}
{% block content %}

<h1 class="mb-6 text-3xl">Conversationox</h1>
<div class="space-y-6">
    {% for message in conversation.messages.all %}

        <div class="p-6 flex {%if message.created_by == request.user %}bg-blue-100 {% else %} bg-gray-100 {% endif %} rounded-xl">
            <div>
                <p class="mb-4"><strong>{{ message.created_by.username }}</strong> | {{ message.created }}</p>
                <p>{{ message.content }}</p>
            </div>
         </div>
    {% endfor %}
</div>

<form action="." method="post">
    {% csrf_token %}
    
    {{ form.as_p }}

    <button type="submit" class="btn btn-info">
                    <span class="glyphicon glyphicon-share-alt"></span>
                    Send
                  </button>
</form>
{% endblock %}
