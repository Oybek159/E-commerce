{% extends 'base.html' %}
{% load static %}
{% block title %}Login page{% endblock %}
{% block content %}
<link rel="stylesheet" href="{% static 'app/css/login.css' %}">
<div id="loginModal" class="modal show" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog">
  <div class="modal-content">
      <div class="modal-header">
          <button type="button" class="close" data-dismiss="modal" aria-hidden="true">×</button>
          <h1 class="text-center">Login</h1>
      </div>
      <div class="modal-body">
          <form class="form col-md-12 center-block" method="POST">
    {% csrf_token %}
    
    <div class="form-group">
        <div class="col-sm-10">
            <label class="inline-block mb-2">Username</label><br>
            <input type="text" 
                   name="username" 
                   placeholder="Enter your username" 
                   class="form-control" 
                   required>
        </div>
    </div>
    
    <div class="form-group">
        <div class="col-sm-10">
            <label class="inline-block mb-2">Password</label><br>
            <input type="password" 
                   name="password" 
                   placeholder="Enter your password" 
                   class="form-control" 
                   required>
        </div>
    </div>
    
    <div class="form-group">
        <button type="submit" class="btn btn-primary btn-lg btn-block">Sign In</button>
        <span class="pull-right"><a href="{% url 'signup' %}">Register</a></span>
        <span><a href="#">Need help?</a></span>
    </div>
</form>
      </div>
      <div class="modal-footer">
          <div class="col-md-1accordion2">
          <button class="btn" data-dismiss="modal" aria-hidden="true">Cancel</button>
    	  </div>	
      </div>
  </div>
  </div>
</div>
{% endblock %}
